<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ross • ¡Hoy brillas en el escenario sonsita! ✨💃</title>
    <!-- Tipografías combinadas: Cinzel para elegancia teatral y Quicksand para suavidad -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor de luces de escenario y partículas flotantes -->
    <div id="stage-lights" class="stage-bg"></div>
    <canvas id="confetti-canvas"></canvas>

    <main class="viewport">
        <div class="container">
            
            <!-- PANTALLA 1: TELÓN CERRADO (EXPECTATIVA) -->
            <section id="pane-1" class="stage-card active">
                <div class="spotlight-beam"></div>
                
                <header class="card-header">
                    <span class="badge">✨ Función Especial ✨</span>
                    <h1 class="title-elegant">¡Turururu!</h1>
                </header>
                
                <div class="hero-frame">
                    <!-- Aquí puedes poner el GIF saludando o una imagen linda -->
                    <img src="Cinamorroll saludo.gif" alt="Cinnamoroll saludando">
                </div>
                
                <p class="body-text">Te quería decir algo...</p>
                
                <footer class="card-footer">
                    <button onclick="openCurtain()" class="btn-gold">
                        <span>Abrir el telón 🎭</span>
                    </button>
                </footer>
            </section>

            <!-- PANTALLA 2: EN EL ESCENARIO (MENSAJE DE SUERTE) -->
            <section id="pane-2" class="stage-card hidden">
                <div class="spotlight-beam"></div>

                <header class="card-header">
                    <span class="badge">Con todo mi cariño y amor</span>
                    <h1 class="title-elegant">¡Mucha suerte hoy peciosa!</h1>
                </header>
                
                <div class="hero-frame spec-frame">
                    <!-- Aquí puedes poner la imagen de Cinnamoroll bailando o CinnaLove.jpg -->
                    <img src="China bailando.jpeg" alt="Cinnamoroll deseando éxito">
                </div>
                
                <div class="message-content">
                    <p class="body-text">Estoy muy orgulloso de ti preciosa. <strong>¡El escenario es tuyo!</strong> 💃✨</p>
                    <p class="love-text">¡Mucho éxito, suerte y te quiero mucho mucho mucho! Te adoro un mundo...</p>
                </div>
                
                <footer class="card-footer">
                    <button onclick="closeCurtain()" class="btn-ghost">
                        ← Volver
                    </button>
                </footer>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
